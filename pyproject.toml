[project]
name = "risk-management"
version = "0.1.0"
description = "Sober-monitor shift assignment + strike tracking for Kappa Sigma Phi-Alpha"
authors = [{ name = "Colin Guenther" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16.0,<0.20.0",
    "rich>=13.7.0,<14.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "fastapi>=0.115,<0.200",
    "uvicorn>=0.30,<0.40",
    "python-multipart>=0.0.9,<0.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
risk = "risk.cli.main:main_entry"
risk-api = "risk.api.__main__:main"
risk-desktop = "risk.desktop.__main__:main"
risk-forwarder = "risk.forwarder:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=5.4,<7",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "import-linter>=2.0.0",
    "httpx>=0.27,<0.30",
    "pyinstaller>=6.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RET", "SIM", "C4", "PTH"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to live in argument
# defaults — exempt them from B008 (function call in default argument).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests touching a real SQLite file",
    "property: Hypothesis property tests",
    "golden: golden-file tests",
]

[tool.coverage.run]
source = ["src/risk"]
branch = true
parallel = true
# Subprocess coverage: tests that shell out to the `risk` CLI pick up
# coverage via sitecustomize.py + COVERAGE_PROCESS_START (set in conftest).
sigterm = true

[tool.coverage.paths]
# Merge multi-process coverage data under one canonical source tree.
source = ["src/risk", "*/src/risk"]

[tool.ruff.lint.per-file-ignores]
# Forensic scripts, kept for provenance: they document how the FA26 roster and
# schedule were derived from the source spreadsheets. Preserved close to as-run
# rather than restyled, because their value is being a faithful record — a
# rewrite to satisfy naming and formatting rules risks quietly changing what
# they did. Only path handling was changed, so they take input as arguments
# instead of hardcoding one machine's Desktop.
# New code does not get these exemptions; scripts/load_*.py are lint-clean.
"scripts/analyze_strict.py" = ["B007", "C408", "C416", "E702", "E731", "N816"]
"scripts/check_roster.py" = ["B007", "C408", "C416", "E702", "E731", "N816"]
"scripts/reconcile.py" = ["B007", "C408", "C416", "E702", "E731", "N816"]
