[project]
name = "risk-management"
version = "0.1.0"
description = "Sober-monitor shift assignment + strike tracking for Kappa Sigma Phi-Alpha"
authors = [{ name = "Colin Guenther" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16.0,<0.20.0",
    "rich>=13.7.0,<14.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.scripts]
risk = "risk.cli.main:app"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "import-linter>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RET", "SIM", "C4", "PTH"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests touching a real SQLite file",
    "property: Hypothesis property tests",
    "golden: golden-file tests",
]

[tool.coverage.run]
source = ["src/risk"]
branch = true
parallel = true
# Subprocess coverage: tests that shell out to the `risk` CLI pick up
# coverage via sitecustomize.py + COVERAGE_PROCESS_START (set in conftest).
sigterm = true

[tool.coverage.paths]
# Merge multi-process coverage data under one canonical source tree.
source = ["src/risk", "*/src/risk"]
